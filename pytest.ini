[pytest]
# Pytest configuration for HearingClinic tests

# Test paths
testpaths =
    hearingclinic

# Python files pattern
python_files = test_*.py

# Python classes pattern
python_classes = Test*

# Python functions pattern
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests
    frontend: Frontend tests
    slow: Slow running tests

# Addopts
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage settings
[coverage:run]
source = hearingclinic
omit =
    */tests/*
    */test_*.py
